<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بازی علوم سوم</title>
<style>
body{font-family:Tahoma,sans-serif;background:linear-gradient(135deg,#a8edff,#f9d9ff,#fff0a8);margin:0;padding:16px;color:#30234c}.wrap{max-width:720px;margin:auto}header,.card{background:white;border:4px solid #ffc83d;border-radius:25px;padding:20px;margin:14px 0;box-shadow:0 6px 0 #e4b23a}header{text-align:center}h1{color:#7139a6;font-size:30px}h2{color:#673ab7}.tag{display:inline-block;background:#fff0c2;border-radius:18px;padding:9px;margin:5px;font-weight:bold}.center{text-align:center}.btn,.opt{font: bold 19px Tahoma;border:0;border-radius:16px;padding:14px;cursor:pointer}.btn{background:#ffca3a;color:#4a3500}.opt{display:block;width:100%;text-align:right;background:#eee5ff;color:#43216b;margin:10px 0;border:2px solid #c8a8ef}.opt:disabled{opacity:1}.good{background:#d8f7df!important;border-color:#43a85d!important}.bad{background:#ffe0e0!important;border-color:#d66!important}.hidden{display:none}.feedback{font-size:17px;font-weight:bold;min-height:48px}.progress{height:12px;background:#eee;border-radius:20px;overflow:hidden}.bar{height:100%;background:#31c5a1;width:0}.small{color:#65708b;font-size:14px}
</style><div class="wrap">
<header><div style="font-size:48px">🧪 🌈 🍎</div><h1>بازی شگفت‌انگیز علوم</h1><h2>پایه سوم دبستان</h2><span class="tag">👩‍🏫 معلم: نجمه قاسمی</span><span class="tag">🏫 مدرسه: نجمه</span></header>
<section id="welcome" class="card center"><div style="font-size:55px">🧑‍🔬⭐</div><h2>آماده‌ای قهرمان کوچک علوم؟</h2><p>به ۴ پرسش پاسخ بده و ستاره جمع کن!</p><button class="btn" onclick="start()">شروع بازی 🚀</button><p class="small">برای هر پاسخ درست یک ستاره می‌گیری.</p></section>
<section id="game" class="card hidden"><b id="count"></b><b id="stars" style="float:left">⭐ ۰</b><div class="progress"><div class="bar" id="bar"></div></div><h2 id="q"></h2><div id="opts"></div><div class="feedback" id="fb"></div><button class="btn hidden" id="next" onclick="advance()">بعدی</button></section>
<section id="end" class="card center hidden"><div style="font-size:60px">🏆🎉</div><h2>آفرین دانشمند کوچک!</h2><h2 id="score"></h2><p id="msg"></p><button class="btn" onclick="again()">دوباره بازی کن 🔄</button></section>
<footer class="center small">بازی آموزشی علوم پایه سوم | موفق باشی! 🌼</footer></div>
<script>
const data=[
['۱) واحد اندازه‌گیری مایعات چیست؟',['لیتر','گرم','کیلوگرم','متر'],0,'مایعات را با واحدهایی مانند لیتر و میلی‌لیتر اندازه می‌گیریم.'],
['۲) واحد اندازه‌گیری جرم چیست؟',['لیتر','کیلوگرم','سانتی‌متر','متر'],1,'جرم را با واحدهایی مانند گرم و کیلوگرم اندازه می‌گیریم.'],
['۳) وسیله اندازه‌گیری جرم چیست؟',['متر خیاطی','ترازو'],1,'برای اندازه‌گیری جرم اجسام از ترازو استفاده می‌کنیم.'],
['۴) نقش میوه‌ها در بدن چیست؟',['ویتامین به بدن می‌رسانند','انرژی به بدن می‌دهند','استخوان‌ها را محکم می‌کنند'],0,'میوه‌ها منبع خوبی از ویتامین‌ها هستند و به سلامت بدن کمک می‌کنند.']];
let n=0,points=0,locked=false;
function start(){document.getElementById('welcome').classList.add('hidden');document.getElementById('game').classList.remove('hidden');n=0;points=0;show()}
function show(){locked=false;let d=data[n];document.getElementById('count').textContent='پرسش '+(n+1)+' از ۴';document.getElementById('stars').textContent='⭐ '+points;document.getElementById('bar').style.width=(n*25)+'%';document.getElementById('q').textContent=d[0];document.getElementById('fb').textContent='';document.getElementById('next').classList.add('hidden');let o=document.getElementById('opts');o.innerHTML='';d[1].forEach((v,k)=>{let b=document.createElement('button');b.className='opt';b.textContent=v;b.onclick=()=>answer(k);o.appendChild(b)})}
function answer(k){if(locked)return;locked=true;let d=data[n],bs=[...document.querySelectorAll('.opt')];bs.forEach((b,j)=>{b.disabled=true;if(j===d[2])b.classList.add('good');else if(j===k)b.classList.add('bad')});let ok=k===d[2];if(ok)points++;document.getElementById('stars').textContent='⭐ '+points;document.getElementById('fb').textContent=(ok?'آفرین! پاسخ درست بود. ⭐ ':'تلاش خوبی بود! 🌱 ')+d[3];let nx=document.getElementById('next');nx.textContent=n===3?'دیدن نتیجه 🏆':'پرسش بعدی ←';nx.classList.remove('hidden')}
function advance(){n++;if(n<4){show();return}document.getElementById('game').classList.add('hidden');document.getElementById('end').classList.remove('hidden');document.getElementById('bar').style.width='100%';document.getElementById('score').textContent='از ۴ ستاره، '+points+' ستاره گرفتی!';document.getElementById('msg').textContent=points===4?'فوق‌العاده بود! تو یک دانشمند کوچک هستی.':points>=2?'آفرین! با کمی تمرین بهتر هم می‌شوی.':'آفرین که تلاش کردی؛ دوباره بازی کن تا بیشتر یاد بگیری.'}
function again(){document.getElementById('end').classList.add('hidden');document.getElementById('game').classList.remove('hidden');n=0;points=0;show()}
</script></html>
